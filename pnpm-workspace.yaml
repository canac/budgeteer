allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  lefthook: true
  msw: false
  prisma: true
  sharp: false
  workerd: true

autoDedupe: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - "@canac/oxc-config"

patchedDependencies:
  "@tanstack/router-core@1.171.37": patches/@tanstack__router-core@1.171.37.patch

permissions:
  "@tanstack/react-start":
    skills: true

skills:
  dirs:
    - .claude/skills
